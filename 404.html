<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>UMich Coursework</title>
    <script>
      // GitHub Pages serves this for unknown paths. Encode the path into a query
      // string and redirect to the app root, where index.html restores it.
      // Keep 1 segment because the site lives at /umich-coursework/.
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
